<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personagens</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #000000;
      color: #ffffff;
    }

    main {
      width: min(100%, 700px);
      margin: 0 auto;
      background: #000000;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    img {
      width: 100%;
      height: auto;
      max-width: 100%;
      border-radius: 8px;
      margin: 1rem 0;
      display: block;
      cursor: pointer;
      object-fit: contain;
    }

    h1 {
      color: #ffffff;
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      cursor: pointer;
    }

    h1:hover {
      color: #DC143C;
      transition: all 0.5s ease;
    }

    p {
      color: #ffffff;
      font-size: clamp(1rem, 2.5vw, 1.1rem);
      line-height: 1.6;
      margin: 0.75rem 0 0;
      cursor: pointer;
    }

    @media screen and (max-width: 600px) {
      body {
        padding: 0;
      }

      main {
        box-sizing: border-box;
        width: 100%;
        padding: 1.2rem;
        border-radius: 10px;
      }

      img {
        width: 100vw;
        max-width: none;
        max-height: 60vh;
        margin: 1rem 0 1rem calc((100% - 100vw) / 2);
        border-radius: 0;
        object-fit: contain;
      }
    }
  </style>
</head>

<body>
  <main id="detalhes-selecao">
    <h1 id="detalhes-titulo">Carregando...</h1>
    <img id="detalhes-imagem" src="" alt="" />
    <p id="detalhes-descricao"></p>


  </main>
  <script src="script.js"></script>
</body>

</html>
